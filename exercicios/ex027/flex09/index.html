<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container {
            background-color: salmon;
            display: flex;
            flex-flow: row wrap;
        }
        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B Outro conteúdo</div>
        <div class="item">C</div>
        <div class="item">D Conteúdo maior</div>
        <div class="item">E</div>
        <div class="item">F Outro conteúdo ainda maior que ocupa mais espaço</div>
        <div class="item">G</div>
    </div>
</body>
</html>
